# Modelling and validation parameters.

paths:
  duckdb: "data/processed/semicycle.duckdb"
  panel:  "data/processed/panel.parquet"
  reports_dir: "reports"

target:
  # What the nowcast predicts: YoY growth of the 3-month moving average of
  # worldwide WSTS billings. 3MMA is the industry-standard smoothing; YoY makes
  # the cycle stationary and comparable to how the sell-side talks about it.
  series: wsts_worldwide
  smoothing_months: 3
  transform: yoy
  horizons: [0, 3, 6]       # h=0 nowcast, h=3 and h=6 months ahead

features:
  # Transform families applied to each input series before it enters the panel.
  yoy: true
  mom_3mma: true
  zscore_expanding_min_periods: 24
  momentum_windows_months: [3, 6, 12]

cycle:
  # Inputs to the dynamic factor model — coincident indicators of one underlying
  # semiconductor demand cycle, each mapped to a stationary transform.
  # (all monthly here, so DynamicFactorMQ runs monthly-only; its EM handles the
  # ragged edges from different series end-dates.)
  inputs:
    # coincident views of *global semiconductor demand*: the four WSTS regional
    # billings (their common component is the worldwide cycle; regional quirks
    # stay in the idiosyncratic part), plus the Taiwan value chain and the
    # equity market's read. US IP / new-orders were tried and dropped — US fab
    # output is a small, capacity-constrained slice that missed the 2021 boom.
    wsts_americas: yoy
    wsts_asia_pacific: yoy
    wsts_europe: yoy
    wsts_japan: yoy
    twrev_aggregate: yoy
    px_SOX: mom12
  factor_orders: 2          # AR(2) on the latent factor
  em_maxiter: 500
  sign_reference: wsts_asia_pacific   # flip the factor so this input loads positive
  start: "1986-01-01"
  dating:                   # Bry-Boschan turning-point rules
    window: 5              # local extremum over +/- 5 months
    min_phase: 5           # peak-to-trough (or trough-to-peak) >= 5 months
    min_cycle: 18          # peak-to-peak (or trough-to-trough) >= 18 months
    edge: 6               # no turn within 6 months of either end of the sample
    level_smooth: 4       # months of smoothing on the zero-line sub-split
    min_run: 4           # merge phase spans shorter than this into the previous one

cv:
  # Expanding-window walk-forward with purge + embargo (Lopez de Prado).
  scheme: expanding
  min_train_months: 96      # 8y before the first out-of-sample prediction
  step_months: 1
  purge_months: 3           # drop training points whose target window overlaps the test month
  embargo_months: 1         # extra gap after the test month before training resumes
  # Headline scoreboard starts here — once the timely indicators (Taiwan monthly
  # revenue from 2005, semiconductor ETFs, FRED semi IP) have a few years of
  # history. The AR benchmark is scored on the identical window. The full-history
  # walk-forward is still written to reports/nowcast_oos_h*.csv.
  oos_start: "2006-01-01"

models:
  ar_benchmark:
    max_lags: 12
    ic: aic
  elasticnet:
    l1_ratios: [0.2, 0.5, 0.8, 1.0]
    n_alphas: 40
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

strategy:
  rebalance: month_end
  cost_bps: 10                # round-trip transaction cost, basis points
  vol_target_annual: 0.20     # (reserved) target vol for a scaled variant
  asset: px_SOXX              # tradable semiconductor vehicle (iShares SOXX, div-adj)
  signal_zwindow: 36          # expanding z-score warm-up on the cycle signal
  level_weight: 1.0           # weight on the factor level in the timing signal
  momentum_weight: 1.0        # weight on the factor's 6-month change
  base_weight: 1.0            # fully invested when the signal is neutral
  gain: 0.40                  # signal -> weight sensitivity
  min_weight: 0.0
  max_weight: 1.25            # a little leverage when the cycle is strong
  start: "2005-07-01"         # first month with enough real-time signal history
  end: "2025-12-31"           # yfinance semi prices show implausible +30-40% monthly
                              # moves from 2026-04 (ETFs moving 2x their top holding);
                              # same era as the corrupt WSTS 2026 rows -> capped
  cscv_partitions: 10         # S in the CSCV computation of the PBO
  # grid the deflated Sharpe ratio and the PBO account for (2^4 = 16 configs)
  grid:
    level_weight: [0.5, 1.0]
    momentum_weight: [0.5, 1.0]
    gain: [0.30, 0.50]
    max_weight: [1.0, 1.25]
