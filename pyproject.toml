[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semicycle"
version = "0.3.0"
description = "Semiconductor Cycle Intelligence — mixed-frequency cycle factor, nowcasting, and a cost-aware equity strategy, all on free public data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Appuhamy" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "openpyxl>=3.1",
    "duckdb>=0.10",
    "pyarrow>=14",
    "pyyaml>=6",
    "pydantic>=2",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "tabulate>=0.9"]

[project.scripts]
semicycle = "semicycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits external APIs, skipped by default in CI"]
